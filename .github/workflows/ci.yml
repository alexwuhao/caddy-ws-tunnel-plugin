name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build, vet and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Match go.mod / release.yml so the built binary and CI agree.
          go-version: "1.25.4"
          check-latest: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # -race needs cgo; ubuntu runners ship gcc, so CGO_ENABLED=1 is enough.
      - name: Test (race)
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...

      - name: Build with xcaddy and verify modules
        run: |
          go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest
          xcaddy build v2.11.4 \
            --with github.com/wjzhangq/caddy-ws-tunnel-plugin=. \
            --output /tmp/caddy-tunnel
          /tmp/caddy-tunnel list-modules | grep -E '^(tunnel|http\.handlers\.tunnel_(server|status)|http\.reverse_proxy\.transport\.tunnel)$'
